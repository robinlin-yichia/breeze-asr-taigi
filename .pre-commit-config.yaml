repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]  # 5MB - guards against accidental audio/model commits
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'   # .bat files need CRLF on Windows

  # Ruff rev tracks the "ruff>=0.6" floor in pyproject.toml. Keep in
  # sync with the CI lint job so local hook output matches CI exactly.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
